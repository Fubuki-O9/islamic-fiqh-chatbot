- topic_id: five_daily_prayers
  topic_name: Number of daily prayers (the five obligatory prayers)
  description: How many obligatory prayers a Muslim must perform each day and night
  references:
    quran:
    - chapter: 4
      ayah: 103
    hadith:
    - source: Sahih Bukhari
      hadith_no: 46
    - source: Sahih Muslim
      hadith_no: 11
  rulings:
    hanafi:
      ruling: Five obligatory prayers each day and night
      explanation: Fajr, Zuhr, Asr, Maghrib and Isha are obligatory (fard) upon every
        accountable Muslim. The Qur'an establishes that prayer is prescribed at fixed
        times (4:103); the number five is established by the Sunnah and the consensus
        of the Ummah.
      certainty: high
    shafi:
      ruling: Five obligatory prayers each day and night
      explanation: Fajr, Zuhr, Asr, Maghrib and Isha are obligatory. The Prophet stated
        that Allah enjoined five prayers in a day and night, and the Ummah is unanimous
        on this.
      certainty: high
    maliki:
      ruling: Five obligatory prayers each day and night
      explanation: Fajr, Zuhr, Asr, Maghrib and Isha are obligatory. The count of
        five comes from the authentic Sunnah and consensus, with their appointed times
        indicated in the Qur'an (4:103).
      certainty: high
  consensus: true
  source_method: web_researched
  scholar_review: pending
